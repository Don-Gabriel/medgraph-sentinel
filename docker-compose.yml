# MedGraph Sentinel — full stack. Contract: docs/INTERFACES.md §9.
# Fresh clone + filled .env -> browsable console in <=3 min post-pull (ADR-005).
# Image names are pinned (medgraph-api:demo / medgraph-frontend:demo) because
# DEMO_RUNBOOK's docker-save commands reference them (ADR-019).

services:
  neo4j:
    # Pinned base: 5.26 LTS pairs with GDS 2.13 (ADR-004). GDS is baked
    # into our own image at BUILD time (graph/neo4j.Dockerfile, ADR-026):
    # the NEO4J_PLUGINS mechanism was verified working on 2026-07-30 but it
    # downloads the jar at EVERY container creation — a hard failure at the
    # offline venue, so it is deliberately not used here.
    build:
      context: ./graph
      dockerfile: neo4j.Dockerfile
    image: medgraph-neo4j:demo
    environment:
      # VERIFIED (neo4j.com llms-full.txt, fetched 2026-07-29): NEO4J_AUTH
      # form and the double-underscore env naming for config settings.
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}"
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_SIZE:-2G}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_SIZE:-2G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE_SIZE:-1G}
      # VERIFIED setting name (Neo4j GDS/Bloom docs): unrestricted procedures
      # for GDS — required since we bypass the NEO4J_PLUGINS installer,
      # which would otherwise set it. M1 gate: RETURN gds.version() → 2.13.x.
      NEO4J_dbms_security_procedures_unrestricted: "gds.*"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      # LOAD CSV reads server-side (ADR-025): the committed dataset must be
      # visible in the server's import directory, where file:/// resolves.
      # NOT :ro — the image entrypoint chowns the import dir and exits(1)
      # on a read-only mount (observed on first M1 run). Nothing writes here.
      - ./data/csv:/var/lib/neo4j/import
    healthcheck:
      # HTTP probe on the browser port; avoids passing credentials into the
      # healthcheck. If wget is absent in the image (M1 test will show),
      # switch to: curl -sf http://localhost:7474 || exit 1
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  seed:
    # One-shot: load committed CSVs — including precomputed alerts
    # (data/csv/alerts.csv + rel_implicates.csv, ADR-029). Never generates
    # data (ADR-005) and never runs detection: detection runs once at demo
    # build time and its output is committed like any other data, so every
    # clone boots in load-time, not detection-time.
    build:
      context: .
      dockerfile: api/Dockerfile
    image: medgraph-api:demo
    command: python -m loader
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
    depends_on:
      neo4j:
        condition: service_healthy
    restart: "no"

  api:
    image: medgraph-api:demo
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      # ADR-037 live-narration tier — all optional; unset = frozen-main
      # behaviour (cache-first, zero network). Key only ever lives in .env.
      NARRATION_LIVE: ${NARRATION_LIVE:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      neo4j:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    image: medgraph-frontend:demo
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - api

volumes:
  neo4j_data:
