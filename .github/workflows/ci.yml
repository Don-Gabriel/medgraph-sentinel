# CI gate (ADR-036, closes OQ #7): ruff + pytest + frontend build.
# Guards post-freeze commits — the ruff rule set is pinned in pyproject.toml
# so the gate catches breakage in NEW commits without restyling code frozen
# on 2026-07-30. Both jobs mirror the locally verified invocations exactly
# (`python -m ...` so the repo root is on sys.path, as in every local run).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11" # pinned stack (ADR-003)
      - run: pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20" # matches frontend/Dockerfile (node:20-alpine)
      - run: npm ci --no-audit --no-fund
      - run: npm run build
