# Typology 2 — credential laundering (DETECTION_SPEC §2). Three sub-signals
# in one rule: (a) one licence number on credentials of >1 doctor (with the
# spec's format-collision guard), (b) billing after revocation, (c)
# jurisdiction shopping. Near-binary evidence, so scores are stepped, not
# blended. Calibrated on the honest economy 2026-07-30 — the honest world
# contains real licence-number collisions and retired-but-still-rostered
# doctors, which is exactly why (a) at two holders and (b) with a stale
# revocation stay low.
key: credential_laundering
name: Credential laundering
typology: 2
version: "1.0"
kind: python
impl: detection.rules.impl.credential_laundering
params:
  # (a) shared licence number. Honest measurement (seed 42): 9 two-holder
  # same-country number collisions, 8 with both holders billing — so two
  # holders + billing must stay low; three holders never happens honestly.
  shared_two_score: 38.0    # two holders: honest format collisions exist -> low
  shared_three_score: 78.0  # three holders is no longer chance
  shared_many_score: 88.0   # four or more
  cross_country_bonus: 12.0 # same number issued in >1 country cannot be a collision
                            #   (honest numbers embed their issuing country)
  active_billing_bonus: 8.0 # >=2 of the holders are actively billing claims
  # (b) post-revocation billing. Honest measurement: 27 doctors bill after a
  # revocation (the economy keeps retirees on clinic rosters), with up to 29
  # post-revocation claims and revocation-to-claim gaps down to 18 days —
  # so neither existence, recency, nor moderate volume separates fraud from
  # honest noise HERE. Every case is emitted (an investigator should see
  # it), but only volume beyond the honest ceiling escalates: the spec's
  # "starts at high" holds for systematic billers, not one-off stragglers.
  grace_days: 14            # FP mode: revocation-date data entry lag
  recent_days: 365          # "revoked recently" bonus window
  recent_bonus: 8.0
  post_revocation_base: 40.0
  volume_ramp_points: 50.0  # added linearly between the claim counts below
  volume_lo_claims: 30      # just above the honest-economy max (29)
  volume_hi_claims: 60      # systematic mill territory -> saturates at high
  # (c) jurisdiction shopping. Honest measurement: 26 doctors with an unused
  # jurisdiction credential and claims in exactly 2 other countries (cross-
  # country rosters are legal here) -> base stays low; 3+ claim countries
  # never happens honestly and escalates.
  shopping_min_countries: 2 # claims in 2+ countries other than the issuing one
  shopping_score: 44.0
  extra_country_bonus: 12.0 # per claim country beyond the minimum
  costack_bonus: 10.0       # same doctor hit by both (b) and (c) — two
                            #   independent signals legitimately reach medium
                            #   (zero co-occurrence in the honest economy)
severity_bands: { high: 80, medium: 50 }
