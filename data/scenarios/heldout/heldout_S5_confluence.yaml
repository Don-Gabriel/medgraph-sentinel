# HELD-OUT SCENARIO — do not commit to the repo until after the one-shot
# evaluation. Authored 2026-07-30 by J Don Gabriel (solo implementer), before
# any detection query existed in the repository. Sources consulted while
# authoring: PROJECT_BRIEF.md, DATA_MODEL.md, INTERFACES.md §3, GLOSSARY.md.
# DETECTION_SPEC.md was not opened during the authoring session. The author
# is the same person who will write the detection rules — this file proves
# ordering (hash-committed before rules existed), not independence.
scenario: heldout_S5_confluence
description: >
  THE DELIBERATELY HARD ONE. A composite cell engineered so that every
  single-typology signal is individually weak: one broker fronts two
  clinics; the second clinic runs a small ghost billing line (25 claims,
  provisional accreditation but nonzero beds); the broker holds only an 8%
  stake in it; side payments are small, irregular (five transfers, one
  shell hop, ~4.3k USD); two doctors across the two clinics share one
  licence number (both credentials ACTIVE — no revocation anywhere); and 3
  pooled identities appear at both clinics with inter-country gaps of
  roughly one to three weeks (feasible travel — NOT impossible). Expected
  honest outcome: single-typology rules fire weakly or not at all; the
  cell is only visible if evidence composes across typologies. If our
  shipped rules miss most of this, that is the finding — report it.
actors:
  - kind: broker
    ref: b1
    props: {country: IN}
  - kind: clinic
    ref: c1
    props: {bed_count: 20, accreditation_status: accredited, country: IN}
  - kind: clinic
    ref: c2
    props: {bed_count: 6, accreditation_status: provisional, country: TR}
  - kind: doctor
    ref: d1
    props: {specialty: cardiac}
  - kind: doctor
    ref: d2
    props: {specialty: dental}
  - kind: credential
    ref: cr1
    props: {license_no: "MC-IN-55190",
            issuing_body: "Medical Council of India",
            issue_date: 2018-06-30, status: active}
  - kind: credential
    ref: cr2
    props: {license_no: "MC-IN-55190",
            issuing_body: "Medical Council of Turkey",
            issue_date: 2020-11-05, status: active}
  - kind: patients
    ref: pool1
    count: 3
edges:
  - type: HOLDS
    from: d1
    to: cr1
  - type: HOLDS
    from: d2
    to: cr2
  - type: ISSUED_IN
    from: cr1
    to: IN
  - type: ISSUED_IN
    from: cr2
    to: TR
  - type: PRACTISES_AT
    from: d1
    to: c1
    props: {since: 2021-04-01}
  - type: PRACTISES_AT
    from: d2
    to: c2
    props: {since: 2023-09-15}
  - type: OWNS_STAKE_IN
    from: b1
    to: c2
    props: {pct: 8}
journeys:
  - count: 45
    clinic: c1
    broker: b1
    doctor: d1
    patients: invented
    category: cardiac
    date_range: [2025-08-15, 2026-04-30]
  - count: 25
    clinic: c2
    broker: b1
    doctor: d2
    patients: invented
    category: dental
    date_range: [2025-11-01, 2026-04-30]
  - count: 3
    clinic: c1
    broker: b1
    doctor: d1
    patients: pool:pool1
    category: cardiac
    date_range: [2026-01-10, 2026-01-20]
  - count: 3
    clinic: c2
    broker: b1
    doctor: d2
    patients: pool:pool1
    category: dental
    date_range: [2026-01-22, 2026-02-12]
transfers:
  - path: [c2.account, shell, b1.account]
    amount_usd: 4300
    count: 5
    attrition_pct: 6
    date_range: [2025-12-01, 2026-04-15]
