# Console server config. Exists for ONE reason: nginx's default header
# buffers (4 x 8k) reject a request whose cookie header is larger, and
# cookies are scoped to HOST, not port — so every other service the demo
# machine has ever run on localhost (other projects' dev servers, the
# medgraph-next stack, anything on :8080) writes into the same jar that
# localhost:5173 must send back. Observed live on the demo laptop
# 2026-09-08: a full-page `400 Bad Request — Request Header Or Cookie Too
# Large` from nginx instead of the console, while the same URL loaded fine
# in a fresh incognito profile. The API was healthy throughout; nothing
# reached the app.
#
# That failure mode is silent until it happens, does not reproduce in a
# clean browser profile, and lands as a blank red error page — the worst
# possible thing to debug in front of a jury. 32k of header buffer costs
# nothing and removes it.
server {
    listen 80;
    server_name _;

    # 4 x 8k (nginx default) -> 8 x 16k. Sized to swallow a heavily
    # polluted localhost cookie jar with room to spare.
    large_client_header_buffers 8 16k;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # The console is a single bundle with no client-side router
        # (no react-router in package.json), so this only matters for a
        # mistyped path: serve the app rather than nginx's 404 page.
        try_files $uri $uri/ /index.html;
    }
}
