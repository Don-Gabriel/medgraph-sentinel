[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medgraph-sentinel"
version = "0.1.0"
description = "Fraud-intelligence graph over cross-border medical tourism (hackathon prototype, synthetic data only)"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "faker",
    "numpy",
    "pyyaml",
    "pydantic>=2",
    "neo4j",
    "fastapi",
    "uvicorn[standard]",
    "anthropic",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx"]

[tool.setuptools.packages.find]
include = ["generator*", "loader*", "detection*", "api*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
